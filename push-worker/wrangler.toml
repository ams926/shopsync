# Serviço de notificações push da ShopSync (Cloudflare Workers, plano grátis).
name = "shopsync-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

# De hora a hora (minuto 0). O próprio Worker decide o que enviar em cada hora.
[triggers]
crons = ["0 * * * *"]

[vars]
PROJECT_ID = "shopsync-eb1cf"
# fuso horário de Moçambique (UTC+2), para contar os dias e as horas certas
FUSO_HORAS = "2"
# hora do resumo do dia, em Maputo
HORA_RESUMO = "8"
# não incomodar entre estas horas (Maputo); "" = sem silêncio
SILENCIO = "22-7"
# endereço do painel, aberto ao tocar na notificação (vazio = o próprio endereço onde ativou o sino)
PAINEL_URL = ""

# Segredos (NÃO ficam neste ficheiro). Defina com:
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT   (cole o JSON da conta de serviço)
#   npx wrangler secret put CHAVE_TESTE                (uma palavra-passe qualquer, para testar)
